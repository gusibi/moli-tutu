name: MyGo native

on:
  workflow_dispatch:
  push:
    tags:
      - "mygo-v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: mygo-app/go.sum
      - name: Test
        working-directory: mygo-app
        env:
          GOTOOLCHAIN: auto
          GOSUMDB: sum.golang.org
        run: |
          go test ./...
          go vet ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: mygo-macos
          - os: windows-latest
            platform: windows/amd64
            artifact: mygo-windows
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: mygo-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: mygo-app/go.sum

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Build
        working-directory: mygo-app
        env:
          GOTOOLCHAIN: auto
          GOSUMDB: sum.golang.org
          # Replace with a Developer ID identity and remove -skip-notarize
          # for production macOS releases.
          MYGO_SIGN_IDENTITY: "-"
        shell: bash
        run: |
          go tool mygo build \
            -platform "${{ matrix.platform }}" \
            -skip-notarize \
            -sign "$MYGO_SIGN_IDENTITY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: mygo-app/dist
